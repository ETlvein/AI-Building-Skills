schema_version: 1

registry:
  id: REFERENCE_REGISTRY
  repository: AI-Building-Skills
  status: FROZEN
  purpose: "Central registry for reusable public technical references used by Skills and AI planning."

governance:
  prompt_standard_repository: "https://github.com/ETlvein/AI-Building-PromptStandard"
  prompt_standard_ref: "v1.0.0"
  prompt_standard_id: PROMPT_STANDARD_V1.0

classification:
  allowed_decisions:
    - ADOPT
    - ADAPT
    - REFERENCE
    - REJECT

  allowed_source_types:
    - OFFICIAL_DOCUMENTATION
    - GITHUB_REPOSITORY
    - OPEN_SOURCE_PROJECT
    - OFFICIAL_SDK
    - TECHNICAL_STANDARD
    - OTHER_PUBLIC_REFERENCE

resolution:
  mode: REGISTRY_FIRST
  reuse_preferred: true
  refresh_when:
    - SOURCE_OUTDATED
    - TECHNOLOGY_VERSION_CHANGED
    - ORIGINAL_APPROACH_FAILED
    - ARCHITECTURE_CHANGED
    - CURRENT_FACT_REQUIRED

public_repository_policy:
  prohibit_credentials: true
  prohibit_private_data: true
  prohibit_unauthorized_business_secrets: true

references: []

updated_date: "2026-09-19"
